name: Build BlissOS 18 Voyager x86_64 FOSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BLISS_BUILD_VARIANT: foss

    steps:

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z-dev \
            ccache \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            squashfs-tools \
            python3-mako \
            libssl-dev \
            ninja-build \
            lunzip \
            syslinux \
            syslinux-utils \
            gettext \
            genisoimage \
            bc \
            xorriso \
            xmlstarlet \
            meson \
            glslang-tools \
            git-lfs \
            libncurses5 \
            libncurses5:i386 \
            libelf-dev \
            aapt \
            zstd \
            rdfind \
            nasm \
            kmod

          git lfs install

      - name: Remove distro Rust
        run: |
          sudo apt remove rustc bindgen cargo -y || true

      - name: Install rustup
        shell: bash
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rust-lang.org/rustup.sh \
            | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install required Rust programs
        shell: bash
        run: |
          source "$HOME/.cargo/env"

          cargo install cargo-ndk

          rustup target add \
            x86_64-linux-android \
            i686-linux-android

          cargo install \
            --version 0.69.1 \
            bindgen-cli

          cargo install cbindgen

          echo "Rust version:"
          rustc --version

          echo "Cargo version:"
          cargo --version

          echo "cargo-ndk:"
          cargo-ndk --version

          echo "bindgen:"
          bindgen --version

          echo "cbindgen:"
          cbindgen --version

      - name: Install repo
        shell: bash
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Voyager manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bliss"
          cd "$GITHUB_WORKSPACE/bliss"

          repo init \
            -u https://github.com/BlissOS/platform_manifest.git \
            -b voyager-x86 \
            --git-lfs

      - name: Sync source
        working-directory: ${{ github.workspace }}/bliss
        run: |
          repo sync \
            -c \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            -j"$(nproc --all)" \
            --optimized-fetch \
            --prune

      - name: Build BlissOS 18 FOSS
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          set -e

          export BLISS_BUILD_VARIANT=foss

          source build/envsetup.sh

          lunch bliss_x86_64-ap4a-userdebug

          make iso_img -j"$(nproc --all)"

      - name: Find ISO
        if: success()
        working-directory: ${{ github.workspace }}/bliss
        run: |
          echo "Searching for ISO..."
          find out -type f -name "*.iso" -print

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-18-Voyager-x86_64-FOSS
          path: |
            bliss/out/**/*.iso
            out/**/*.iso
          if-no-files-found: error
          compression-level: 0
