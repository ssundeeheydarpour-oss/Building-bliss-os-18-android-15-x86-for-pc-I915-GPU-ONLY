name: Build BlissOS 18 Voyager x86_64 FOSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      BLISS_BUILD_VARIANT: foss
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install BlissOS build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z-dev \
            ccache \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            squashfs-tools \
            python3-mako \
            libssl-dev \
            ninja-build \
            lunzip \
            syslinux \
            syslinux-utils \
            gettext \
            genisoimage \
            bc \
            xorriso \
            xmlstarlet \
            meson \
            glslang-tools \
            git-lfs \
            libncurses6 \
            libncurses6:i386 \
            libelf-dev \
            aapt \
            zstd \
            rdfind \
            nasm \
            kmod \
            rsync \
            wget \
            ca-certificates

          git lfs install

      - name: Create ncurses compatibility libraries
        run: |
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 \
            /lib/x86_64-linux-gnu/libncurses.so.5

          sudo ln -sf /lib/x86_64-linux-gnu/libncursesw.so.6 \
            /lib/x86_64-linux-gnu/libncursesw.so.5

          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 \
            /lib/x86_64-linux-gnu/libtinfo.so.5

          sudo ln -sf /lib/i386-linux-gnu/libncurses.so.6 \
            /lib/i386-linux-gnu/libncurses.so.5

          sudo ln -sf /lib/i386-linux-gnu/libncursesw.so.6 \
            /lib/i386-linux-gnu/libncursesw.so.5

          sudo ln -sf /lib/i386-linux-gnu/libtinfo.so.6 \
            /lib/i386-linux-gnu/libtinfo.so.5

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install Rust with rustup
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs | \
            sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure Rust
        run: |
          source "$HOME/.cargo/env"

          rustup default stable

          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

          cargo install cargo-ndk
          cargo install --version 0.69.1 bindgen-cli
          cargo install cbindgen

          rustc --version
          cargo --version
          cargo-ndk --version
          bindgen --version
          cbindgen --version

      - name: Initialize Voyager source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bliss"

          cd "$GITHUB_WORKSPACE/bliss"

          repo init \
            -u https://github.com/BlissOS/platform_manifest.git \
            -b voyager-x86 \
            --git-lfs

      - name: Sync source
        working-directory: ${{ github.workspace }}/bliss
        run: |
          repo sync \
            -c \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            -j"$(nproc --all)" \
            --optimized-fetch \
            --prune

      - name: Prepare FOSS packages
        working-directory: ${{ github.workspace }}/bliss
        run: |
          test -d vendor/foss

          cd vendor/foss

          chmod +x update.sh

          printf "1\n" | ./update.sh

      - name: Verify build environment
        working-directory: ${{ github.workspace }}/bliss
        run: |
          test -f build/envsetup.sh

          echo "FOSS packages:"
          find vendor/foss -maxdepth 2 -type f | head -50

      - name: Configure ccache
        run: |
          ccache --max-size=10G
          ccache --show-config

      - name: Build BlissOS 18 FOSS
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          set -e

          source build/envsetup.sh

          export BLISS_BUILD_VARIANT=foss

          lunch bliss_x86_64-userdebug

          make iso_img -j"$(nproc --all)"

      - name: Find ISO
        if: success()
        working-directory: ${{ github.workspace }}/bliss
        run: |
          echo "===== ISO FILES ====="

          find out -type f \
            \( -iname "*.iso" -o -iname "*.img" \) \
            -print

      - name: Upload BlissOS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-18-Voyager-x86_64-FOSS
          path: |
            bliss/out/**/*.iso
            bliss/out/**/*.img
            out/**/*.iso
            out/**/*.img
          if-no-files-found: error
          compression-level: 0
