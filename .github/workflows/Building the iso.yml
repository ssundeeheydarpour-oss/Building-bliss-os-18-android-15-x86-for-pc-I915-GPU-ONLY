name: Build BlissOS 18 Voyager x86_64 FOSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BLISS_BUILD_VARIANT: foss
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            wget \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z-dev \
            ccache \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            squashfs-tools \
            python3-mako \
            libssl-dev \
            ninja-build \
            lunzip \
            syslinux \
            syslinux-utils \
            gettext \
            genisoimage \
            bc \
            xorriso \
            xmlstarlet \
            meson \
            glslang-tools \
            git-lfs \
            libncurses5 \
            libncurses5:i386 \
            libelf-dev \
            aapt \
            zstd \
            rdfind \
            nasm \
            kmod

          git lfs install

      - name: Remove distro Rust
        run: |
          sudo apt-get remove -y rustc cargo bindgen || true

      - name: Install rustup
        shell: bash
        run: |
          set -e

          curl -L \
            https://raw.githubusercontent.com/rust-lang/rustup/master/rustup-init.sh \
            -o rustup-init.sh

          chmod +x rustup-init.sh

          ./rustup-init.sh \
            -y \
            --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure Rust
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cargo install cargo-ndk

          rustup target add \
            x86_64-linux-android \
            i686-linux-android

          cargo install \
            --version 0.69.1 \
            bindgen-cli

          cargo install cbindgen

          echo "===== Rust ====="
          rustc --version
          cargo --version

          echo "===== cargo-ndk ====="
          cargo-ndk --version

          echo "===== bindgen ====="
          bindgen --version

          echo "===== cbindgen ====="
          cbindgen --version

      - name: Install repo
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize BlissOS Voyager
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/bliss"

          cd "$GITHUB_WORKSPACE/bliss"

          repo init \
            -u https://github.com/BlissOS/platform_manifest.git \
            -b voyager-x86 \
            --git-lfs

      - name: Sync BlissOS
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          set -e

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            -j"$(nproc --all)" \
            --optimized-fetch \
            --prune

      - name: Prepare FOSS
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          set -e

          export BLISS_BUILD_VARIANT=foss

          if [ -f vendor/foss/update.sh ]; then
            chmod +x vendor/foss/update.sh
            vendor/foss/update.sh
          else
            echo "FOSS update script not found."
            echo "Using BLISS_BUILD_VARIANT=foss."
          fi

      - name: Build BlissOS 18 FOSS
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          set -e

          export BLISS_BUILD_VARIANT=foss

          source build/envsetup.sh

          lunch bliss_x86_64-ap4a-userdebug

          echo "================================="
          echo "Building BlissOS 18 FOSS"
          echo "Target: bliss_x86_64-ap4a-userdebug"
          echo "================================="

          make iso_img -j"$(nproc --all)"

      - name: Locate ISO
        if: success()
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          echo "===== ISO FILES ====="

          find out \
            -type f \
            -iname "*.iso" \
            -print

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-18-Voyager-x86_64-FOSS
          path: |
            bliss/out/**/*.iso
            out/**/*.iso
          if-no-files-found: error
          compression-level: 0
