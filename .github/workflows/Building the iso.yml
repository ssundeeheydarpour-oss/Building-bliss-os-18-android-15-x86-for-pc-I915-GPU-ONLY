name: Build BlissOS 18 Voyager x86_64 FOSS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BLISS_BUILD_VARIANT: foss
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:

      # -----------------------------
      # Free some preinstalled space
      # -----------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      # -----------------------------
      # BlissOS dependencies
      # Exact packages from Voyager
      # README
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            gperf \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z-dev \
            ccache \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            squashfs-tools \
            python3-mako \
            libssl-dev \
            ninja-build \
            lunzip \
            syslinux \
            syslinux-utils \
            gettext \
            genisoimage \
            bc \
            xorriso \
            xmlstarlet \
            meson \
            glslang-tools \
            git-lfs \
            libncurses5 \
            libncurses5:i386 \
            libelf-dev \
            aapt \
            zstd \
            rdfind \
            nasm \
            kmod

          git lfs install

      # -----------------------------
      # Rust
      # -----------------------------
      - name: Remove distro Rust
        run: |
          sudo apt-get remove -y rustc bindgen cargo || true

      - name: Install rustup
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs | \
            sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure Rust
        shell: bash
        run: |
          source "$HOME/.cargo/env"

          rustup default stable

          cargo install cargo-ndk

          rustup target add \
            x86_64-linux-android \
            i686-linux-android

          cargo install --version 0.69.1 bindgen-cli
          cargo install cbindgen

          echo "Rust:"
          rustc --version
          cargo --version

          echo "cargo-ndk:"
          cargo-ndk --version

          echo "bindgen:"
          bindgen --version

          echo "cbindgen:"
          cbindgen --version

      # -----------------------------
      # Repo
      # -----------------------------
      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # -----------------------------
      # Initialize Voyager
      # -----------------------------
      - name: Initialize BlissOS Voyager
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bliss"
          cd "$GITHUB_WORKSPACE/bliss"

          repo init \
            -u https://github.com/BlissOS/platform_manifest.git \
            -b voyager-x86 \
            --git-lfs

      # -----------------------------
      # Sync
      # -----------------------------
      - name: Sync BlissOS source
        working-directory: ${{ github.workspace }}/bliss
        run: |
          repo sync \
            -c \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            -j"$(nproc --all)" \
            --optimized-fetch \
            --prune

      # -----------------------------
      # Verify source
      # -----------------------------
      - name: Verify Voyager source
        working-directory: ${{ github.workspace }}/bliss
        run: |
          echo "Checking envsetup..."
          test -f build/envsetup.sh

          echo "Checking FOSS..."
          test -n "$BLISS_BUILD_VARIANT"
          echo "BLISS_BUILD_VARIANT=$BLISS_BUILD_VARIANT"

          echo "Checking manifest..."
          git -C .repo/manifests branch --show-current || true

          echo "Source ready."

      # -----------------------------
      # Build
      # -----------------------------
      - name: Build BlissOS 18 FOSS
        working-directory: ${{ github.workspace }}/bliss
        shell: bash
        run: |
          set -e

          export BLISS_BUILD_VARIANT=foss

          source build/envsetup.sh

          lunch bliss_x86_64-ap4a-userdebug

          echo "Starting BlissOS FOSS build..."

          make iso_img -j"$(nproc --all)"

      # -----------------------------
      # Find ISO
      # -----------------------------
      - name: Find ISO
        if: success()
        working-directory: ${{ github.workspace }}/bliss
        run: |
          echo "Searching for ISO..."

          find out \
            -type f \
            -iname "*.iso" \
            -print

      # -----------------------------
      # Upload ISO
      # -----------------------------
      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlissOS-18-Voyager-x86_64-FOSS
          path: |
            bliss/out/**/*.iso
            bliss/out/**/*.img
            out/**/*.iso
            out/**/*.img
          if-no-files-found: error
          compression-level: 0
